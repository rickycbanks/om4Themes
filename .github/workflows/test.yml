name: test

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analyzer (dev)
        run: pip install -e ./analyzer[dev]
      - name: Run pytest
        run: python -m pytest analyzer/tests -q
